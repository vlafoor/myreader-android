name: Build MyReader APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MyReader base source
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/myreader-v04.zip
          unzip -o /tmp/myreader-v04.zip -d .
          sed -i 's/String displayName,nativeId,title,author,cover,ext; int pageCount;/String displayName,nativeId,title,author,cover,ext; File file; int pageCount;/' app/src/main/java/com/myreader/app/MainActivity.java

      - name: Apply MyReader v0.5 patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_v05.py
          python /tmp/patch_v05.py

      - name: Apply MyReader v0.6 patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_v06.py
          python /tmp/patch_v06.py

      - name: Apply MyReader v0.8 patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_v08.py
          python /tmp/patch_v08.py
          # v0.9: fix the actual cause of all dead buttons: a JavaScript syntax error left by pagination patch
          sed -i 's/let scrollTimer;scrollTimer=setTimeout(saveTextProgress,180);updateReaderProgress()});/let scrollTimer;/' app/src/main/assets/index.html
          python -c "import re; s=open('app/src/main/assets/index.html',encoding='utf-8').read(); m=re.search(r'<script>(.*)</script>',s,re.S); assert m; open('/tmp/myreader-app.js','w',encoding='utf-8').write(m.group(1))"
          node --check /tmp/myreader-app.js

      - name: Apply MyReader v0.10 patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_v10.py
          python -c "from pathlib import Path; p=Path('/tmp/patch_v10.py'); s=p.read_text(); a=s.index(\"# Suppress Android's distant floating selection toolbar\"); b=s.index('# Version marker for easier install/debug identification.'); p.write_text(s[:a]+s[b:])"
          python /tmp/patch_v10.py
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("app/src/main/java/com/myreader/app/MainActivity.java")
          s=p.read_text()
          marker="// MyReader: suppress Android native text action bar; app shows its own nearby toolbar."
          if marker not in s:
              m=re.search(r'(?m)^([ \t]*)webView\.loadUrl\("file:///android_asset/index\.html"\);', s)
              if not m:
                  raise SystemExit("missing webView.loadUrl anchor")
              i=m.group(1)
              j=i+"    "
              callback=(
                  i+marker+"\n"+
                  i+"webView.setCustomSelectionActionModeCallback(new android.view.ActionMode.Callback() {\n"+
                  j+"@Override public boolean onCreateActionMode(android.view.ActionMode mode, android.view.Menu menu) { return false; }\n"+
                  j+"@Override public boolean onPrepareActionMode(android.view.ActionMode mode, android.view.Menu menu) { return false; }\n"+
                  j+"@Override public boolean onActionItemClicked(android.view.ActionMode mode, android.view.MenuItem item) { return false; }\n"+
                  j+"@Override public void onDestroyActionMode(android.view.ActionMode mode) {}\n"+
                  i+"});\n"
              )
              s=s[:m.start()]+callback+s[m.start():]
              p.write_text(s)
          PY
          python -c "import re; s=open('app/src/main/assets/index.html',encoding='utf-8').read(); m=re.search(r'<script>(.*)</script>',s,re.S); assert m; open('/tmp/myreader-v10.js','w',encoding='utf-8').write(m.group(1))"
          node --check /tmp/myreader-v10.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyReader-v0.10-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyReader-v0.10-APK
          path: MyReader-v0.10-debug.apk
          retention-days: 30
