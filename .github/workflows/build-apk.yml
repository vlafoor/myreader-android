name: Build MyReader APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MyReader v0.4 source
        shell: bash
        run: |
          cat > /tmp/myreader-v04.b64 <<'MYREADER_PAYLOAD'

MYREADER_PAYLOAD
          base64 -d /tmp/myreader-v04.b64 > /tmp/myreader-v04.zip
          unzip -o /tmp/myreader-v04.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyReader-v0.4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyReader-v0.4-APK
          path: MyReader-v0.4-debug.apk
          retention-days: 30
